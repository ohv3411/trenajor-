/* ===== 10_util.js ===== */
/* ============================================================
   ԸՆԴՀԱՆՈՒՐ ՕԳՆԱԿԱՆՆԵՐ
   Օգտագործվում են բոլոր թեմաների գեներատորներում։
   ============================================================ */

const rand   = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randEl = (arr) => arr[Math.floor(Math.random() * arr.length)];

// Fisher–Yates — ազնիվ խառնում (sort(() => Math.random()-0.5)-ը կողմնակալ է)
const shuffle = (arr) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// Զրոյից տարբեր պատահական թիվ
const randNZ = (min, max) => { let v = 0; while (v === 0) v = rand(min, max); return v; };

// Ամենամեծ ընդհանուր բաժանարար / ամենափոքր ընդհանուր բազմապատիկ
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);

// Float-ի աղբը մաքրող կլորացում. 8.999999999999998 -> 9
const fix = (v, p = 6) => {
  if (typeof v !== 'number' || !Number.isFinite(v)) return v;
  return Math.round(v * Math.pow(10, p)) / Math.pow(10, p);
};

// LaTeX-ի համար նշանով գրառում. 3 -> "+ 3", -3 -> "- 3"
const sgn  = (v) => (v >= 0 ? `+ ${v}` : `- ${Math.abs(v)}`);
const sgnT = (v) => (v >= 0 ? `+${v}` : `${v}`);

// Գործակից փոփոխականի առաջ, առանց տգեղ "1x"/"-1x"-ի. cx(1)="x", cx(-1)="-x", cx(3)="3x"
const cx = (k, v = 'x') => (k === 1 ? v : k === -1 ? `-${v}` : `${k}${v}`);

// Նույնը, բայց ՆՇԱՆՈՎ (հավասարման 2-րդ+ անդամի համար, օր. "+3y"/"-y"/"+y").
// sgnT(n)-ը ինքնին ՉԻ կարող սա անել, քանի որ այն նախատեսված է միայն
// ազատ անդամի համար (առանց հաջորդող փոփոխականի) — sgnT(1)+"y" կտար
// տգեղ "+1y": sgnCx(1,'y')="+y", sgnCx(-1,'y')="-y", sgnCx(3,'y')="+3y"
const sgnCx = (k, v = 'x') => (k === 1 ? `+${v}` : k === -1 ? `-${v}` : `${sgnT(k)}${v}`);

// Կոտորակ որպես LaTeX, ավտոմատ կրճատված
const frac = (n, d) => {
  const g = gcd(n, d) || 1;
  n /= g; d /= g;
  if (d === 1) return `${n}`;
  return `\\frac{${n}}{${d}}`;
};

// Զույգ առանձին տարրեր զանգվածից
const pick2 = (arr) => { const s = shuffle(arr); return [s[0], s[1]]; };

/* Ցանկացած պատասխան (թիվ, "$\frac{a}{b}$", կամ "12,34" ստորակետով)
   վերածում է թվային արժեքի՝ ԱՆԿԱԽ ստուգման համար։
   Սա թույլ է տալիս համեմատել generator-ի ans-ը մեկ այլ, առանձին
   հաշվարկված արժեքի հետ՝ առանց ձևաչափին կապվելու։ Վերադարձնում է
   NaN, եթե չի հաջողվում վերլուծել (այդ դեպքում ստուգումը բաց է թողնվում)։ */
const toNumeric = (v) => {
  if (typeof v === 'number') return v;
  if (typeof v !== 'string') return NaN;
  const fm = v.match(/\\frac\{(-?\d+(?:\.\d+)?)\}\{(-?\d+(?:\.\d+)?)\}/);
  if (fm) return Number(fm[1]) / Number(fm[2]);
  const cleaned = v.replace(/\$/g, '').trim().replace(',', '.');
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : NaN;
};


/* ===== 20_validator.js ===== */
/* ============================================================
   ՎԱԼԻԴԱՏՈՐ — ՈՐԱԿԻ ՊԱՀԱՊԱՆԸ
   Ամեն գեներացված խնդիր անցնում է այստեղից։ Եթե խնդիրը վատ է
   (տգեղ կոտորակ, կրկնվող տարբերակ, պակաս տարբերակ), այն ՉԻ
   ցուցադրվում աշակերտին — շարժիչը պարզապես գեներացնում է նորը։
   ============================================================ */

const Validator = {

  MAX_TRIES: 80,

  // Թիվը «մաքո՞ւր» է. ամբողջ, կամ առավելագույնը N նիշ ստորակետից հետո
  isCleanNumber(v, rules) {
    if (typeof v !== 'number') return true;          // տողային պատասխան
    if (!Number.isFinite(v)) return false;
    const f = fix(v);
    if (!rules.allowNegative && f < 0) return false;
    if (Number.isInteger(f)) return true;
    const s = String(f);
    if (s.includes('e')) return false;
    const dec = (s.split('.')[1] || '').length;
    return dec <= rules.maxDecimals;
  },

  // Նորմալացնում ենք արժեքը՝ float-ի աղբը մաքրելով
  norm(v) { return typeof v === 'number' ? fix(v) : v; },

  /* Ստուգում է մեկ գեներացված խնդիր։
     Վերադարձնում է { ok:true, task } կամ { ok:false, reason } */
  check(raw, rules) {
    if (!raw || typeof raw !== 'object') return { ok: false, reason: 'ոչ օբյեկտ' };

    // --- q դաշտ ---
    if (typeof raw.q !== 'string' || !raw.q.trim()) return { ok: false, reason: 'q դատարկ է' };
    if (/<[a-zA-Z]/.test(raw.q)) return { ok: false, reason: 'HTML թեգ q-ի մեջ' };

    // --- ans դաշտ ---
    const ans = this.norm(raw.ans);
    if (typeof ans !== 'number' && typeof ans !== 'string') return { ok: false, reason: 'ans-ի սխալ տիպ' };
    if (typeof ans === 'string' && !ans.trim()) return { ok: false, reason: 'ans դատարկ է' };
    if (!this.isCleanNumber(ans, rules)) return { ok: false, reason: 'տգեղ պատասխան: ' + ans };

    // --- սխալ տարբերակներ ---
    if (!Array.isArray(raw.bad)) return { ok: false, reason: 'bad զանգված չկա' };

    const seen = new Set([String(ans)]);
    const bad = [];
    for (const item of raw.bad) {
      if (!item || item.v === undefined || item.v === null) continue;
      const v = this.norm(item.v);
      if (typeof v !== 'number' && typeof v !== 'string') continue;
      if (typeof v === 'string' && !v.trim()) continue;
      if (!this.isCleanNumber(v, rules)) continue;      // տգեղ distractor՝ դուրս
      if (seen.has(String(v))) continue;                // կրկնություն կամ = ans
      seen.add(String(v));
      bad.push({ v, why: item.why || '' });
      if (bad.length === 3) break;
    }
    if (bad.length < 3) return { ok: false, reason: `միայն ${bad.length} վավեր տարբերակ` };

    // --- rationale ---
    if (typeof raw.rationale !== 'string' || !raw.rationale.trim())
      return { ok: false, reason: 'rationale չկա' };

    return { ok: true, task: { q: raw.q, ans, bad, rationale: raw.rationale, unit: raw.unit || '' } };
  },

  /* ԱՆԿԱԽ ՍՏՈՒԳՈՒՄ — ամենակարևոր շերտը։
     gen()-ը թիվը հաշվում է մեկ բանաձևով և ցույց տալիս նույն թիվը՝
     no cross-check. Եթե բանաձևը սխալ է գրված, ոչինչ դա չի բռնի,
     որովհետև "սխալ պատասխանը" միշտ էլ "մաքուր" թիվ է։
     Այստեղ taskDef.verify(vars)-ը մեկ ուրիշ, առանձին գրված
     հաշվարկով վերարտադրում է ակնկալվող պատասխանը և համեմատում է
     gen()-ի ans-ի հետ։ Անհամապատասխանությունը մերժում է հարցը։ */
  verifyIndependent(raw, taskDef) {
    if (typeof taskDef.verify !== 'function') return { ok: true };   // թեմայում դեռ ավելացված չէ
    if (!raw.vars) return { ok: false, reason: 'verify կա, բայց gen() vars չի վերադարձնում' };
    let expected;
    try { expected = taskDef.verify(raw.vars); }
    catch (e) { return { ok: false, reason: 'verify() բացառություն: ' + e.message }; }
    const a = toNumeric(this.norm(raw.ans));
    const b = toNumeric(expected);
    if (Number.isNaN(a) && Number.isNaN(b)) {
      // Երկուսն էլ ոչ-թվային են (կոորդինատային զույգ, անհավասարության
      // նշան, տեքստային պատասխան) — համեմատում ենք որպես տեքստ, ոչ թե
      // լուռ բաց ենք թողնում (նախկինում այստեղ verify()-ն ոչինչ չէր
      // ստուգում այս տեսակի պատասխանների համար)։
      if (String(this.norm(raw.ans)).trim() !== String(expected).trim()) {
        return { ok: false, reason: `ԱՆՀԱՄԱՊԱՏԱՍԽԱՆՈՒԹՅՈՒՆ (տեքստ). gen() ans="${raw.ans}", verify() ans="${expected}"` };
      }
      return { ok: true };
    }
    if (Number.isNaN(a) || Number.isNaN(b)) return { ok: true };     // մեկը վերլուծելի է, մյուսը՝ ոչ. անվտանգ չէ համեմատել, բաց ենք թողնում
    if (Math.abs(a - b) > 1e-6) {
      return { ok: false, reason: `ԱՆՀԱՄԱՊԱՏԱՍԽԱՆՈՒԹՅՈՒՆ. gen() ans=${a}, verify() ans=${b}` };
    }
    return { ok: true };
  },

  /* Կանչում է գեներատորը մինչև վավեր խնդիր ստացվի։
     Եթե MAX_TRIES փորձից հետո էլ չի ստացվում, ուրեմն գեներատորը
     մաթեմատիկորեն սխալ է կառուցված — թեստը դա բռնում է։ */
  safeGenerate(taskDef, rules) {
    let last = 'չփորձված';
    for (let i = 0; i < this.MAX_TRIES; i++) {
      let raw;
      try { raw = taskDef.gen(); }
      catch (e) { last = 'բացառություն: ' + e.message; continue; }
      const res = this.check(raw, rules);
      if (res.ok) {
        const vres = this.verifyIndependent(raw, taskDef);
        if (!vres.ok) { last = vres.reason; continue; }
        res.task.subtopic   = taskDef.subtopic;
        res.task.bloom      = taskDef.bloom;
        res.task.badgeClass = taskDef.badgeClass || 'lvl-1';
        res.task.level      = taskDef.level;
        return res.task;
      }
      last = res.reason;
    }
    return { failed: true, subtopic: taskDef.subtopic, reason: last };
  }
};


/* ===== 30_registry.js ===== */
/* ============================================================
   ԳՐԱՆՑԱՄԱՏՅԱՆ + ԱՌԱՋԸՆԹԱՑ
   Թեմաների ֆայլերը իրենք են գրանցվում այստեղ TOPIC(...)-ով։
   ============================================================ */

const REGISTRY = {};   // { "math:percent": {...}, ... }

// Ամեն թեմայի ֆայլ կանչում է սա։ Ոչ մի ցուցակ ձեռքով թարմացնելու կարիք չկա։
function TOPIC(def) {
  const key = `${def.subject}:${def.id}`;
  def.key = key;
  def.levels = CONFIG.levels;
  REGISTRY[key] = def;
  return def;
}

// Թեմայի բոլոր առաջադրանքի տիպերը տվյալ մակարդակի համար
function tasksOf(topic, level) {
  return topic.tasks.filter(t => t.level === level);
}

/* ---------- ԱՌԱՋԸՆԹԱՑ (localStorage) ---------- */

const Progress = {
  KEY_P: 'trenajor_progress_v2',
  KEY_M: 'trenajor_mistakes_v2',
  data: {},
  mistakes: [],

  load() {
    try { this.data = JSON.parse(localStorage.getItem(this.KEY_P)) || {}; } catch (e) { this.data = {}; }
    try { this.mistakes = JSON.parse(localStorage.getItem(this.KEY_M)) || []; } catch (e) { this.mistakes = []; }
  },
  save() {
    try {
      localStorage.setItem(this.KEY_P, JSON.stringify(this.data));
      localStorage.setItem(this.KEY_M, JSON.stringify(this.mistakes));
    } catch (e) { /* private mode — լուռ անտեսում ենք */ }
  },

  get(key) { return this.data[key] || { best: 0, done: false }; },

  /* Աշակերտի դասարանը. պահվում է առանձին բանալիով, որ առաջընթացի
     տվյալների հետ չխառնվի։ '0' = բոլոր դասարանները։ */
  KEY_G: 'trenajor_grade_v2',
  getGrade() {
    try { return localStorage.getItem(this.KEY_G) || '0'; } catch (e) { return '0'; }
  },
  setGrade(g) {
    try { localStorage.setItem(this.KEY_G, String(g)); } catch (e) { /* private mode */ }
  },


  reachLevel(key, level) {
    const t = this.get(key);
    if (level > t.best) t.best = level;
    this.data[key] = t; this.save();
  },
  complete(key) {
    const t = this.get(key);
    t.done = true; t.best = CONFIG.levels;
    this.data[key] = t; this.save();
  },

  addMistake(key, level, subtopic) {
    if (this.mistakes.some(m => m.key === key && m.subtopic === subtopic)) return;
    this.mistakes.push({ key, level, subtopic });
    this.save();
  },
  clearMistake(key, subtopic) {
    this.mistakes = this.mistakes.filter(m => !(m.key === key && m.subtopic === subtopic));
    this.save();
  },
  resetAll() {
    this.data = {}; this.mistakes = [];
    try { localStorage.removeItem(this.KEY_P); localStorage.removeItem(this.KEY_M); } catch (e) {}
  }
};


/* ===== 40_engine.js ===== */
/* ============================================================
   ԽԱՂԱՅԻՆ ՇԱՐԺԻՉ
   Չգիտի ոչ մի կոնկրետ առարկայի կամ թեմայի մասին։ Աշխատում է
   միայն REGISTRY-ի, Validator-ի և UI-ի հետ։ Չդիպչել՝ առանց կարիքի։
   ============================================================ */

const Engine = {
  topic: null,
  rules: null,
  mode: CONFIG.defaultMode,
  level: 1,
  health: CONFIG.startingHealth,
  correct: 0,
  answered: false,
  current: null,
  pool: [],            // տվյալ մակարդակի չօգտագործված ենթաթեմաները
  reviewQueue: null,   // սխալների կրկնության ռեժիմ

  /* ---------- Մեկնարկ ---------- */

  startTopic(key, mode) {
    this.topic = REGISTRY[key];
    this.rules = CONFIG.subjects[this.topic.subject].rules;
    this.mode = mode || CONFIG.defaultMode;
    this.level = 1;
    this.health = CONFIG.startingHealth;
    this.correct = 0;
    this.reviewQueue = null;
    this.refillPool();
    UI.showGame();
    this.next();
  },

  startReview() {
    const q = shuffle(Progress.mistakes).slice(0, 10);
    if (!q.length) return;
    this.reviewQueue = q;
    this.mode = 'practice';
    this.health = CONFIG.startingHealth;
    this.correct = 0;
    this.level = 1;
    this.topic = REGISTRY[q[0].key];
    this.rules = CONFIG.subjects[this.topic.subject].rules;
    UI.showGame();
    this.next();
  },

  /* Մակարդակի բոլոր ենթաթեմաները խառնում ենք և բաժանում առանց
     կրկնության — այսպես ամեն մակարդակի խնդիրները բոլորն ԻՐԱՐԻՑ
     ՏԱՐԲԵՐ տիպի են։ Մակարդակն անցնելու շեմը դինամիկ է. հավասար է
     տվյալ մակարդակի տարբեր տեսակների քանակին, այսինքն՝ մակարդակն
     անցնելը նշանակում է՝ բոլոր ենթաթեմաներից գոնե մեկական հարց
     ճիշտ է պատասխանվել (ոչ թե պատահական 3-ը 3-ից 5-ի կամ ավելիի)։ */
  refillPool() {
    this.pool = shuffle(tasksOf(this.topic, this.level));
    this.requiredForLevel = this.pool.length;
  },

  pickTaskDef() {
    if (this.reviewQueue) {
      const m = this.reviewQueue[0];
      this.topic = REGISTRY[m.key];
      this.rules = CONFIG.subjects[this.topic.subject].rules;
      const found = this.topic.tasks.find(t => t.subtopic === m.subtopic);
      return found || randEl(this.topic.tasks);
    }
    if (!this.pool.length) this.refillPool();
    return this.pool.shift();
  },

  next() {
    this.answered = false;
    const def = this.pickTaskDef();
    const task = Validator.safeGenerate(def, this.rules);

    if (task.failed) {                 // չպետք է պատահի — թեստը սա բռնում է
      UI.showBroken(task);
      return;
    }
    this.current = task;
    this._shownAt = Date.now();

    const opts = shuffle([
      { text: task.ans, correct: true },
      ...task.bad.map(b => ({ text: b.v, correct: false, why: b.why }))
    ]);
    UI.renderTask(task, opts);
  },

  /* Կրկնում է ՆՈՒՅՆ ենթաթեման (Մարզում ռեժիմում սխալից հետո) */
  retrySame() {
    this.answered = false;
    const def = this.topic.tasks.find(t => t.subtopic === this.current.subtopic);
    const task = Validator.safeGenerate(def, this.rules);
    if (task.failed) { UI.showBroken(task); return; }
    this.current = task;
    this._shownAt = Date.now();
    const opts = shuffle([
      { text: task.ans, correct: true },
      ...task.bad.map(b => ({ text: b.v, correct: false, why: b.why }))
    ]);
    UI.renderTask(task, opts);
  },

  /* ---------- Պատասխան ---------- */

  answer(opt, btn) {
    if (this.answered) return;
    this.answered = true;
    UI.lockOptions();

    this._lastCorrect = !!opt.correct;

    if (opt.correct) {
      this.correct++;
      if (this.reviewQueue) {
        Progress.clearMistake(this.topic.key, this.current.subtopic);
        this.reviewQueue.shift();
      }
      UI.feedback(true, this.current, null, btn);
    } else {
      Progress.addMistake(this.topic.key, this.level, this.current.subtopic);
      if (this.mode === 'exam') this.health--;
      UI.feedback(false, this.current, opt.why, btn);
    }
    UI.stats();
    try {   // հաշվետվություն (Report-ը լռելյայն անջատված է և ոչինչ չի անում)
      if (typeof Report !== 'undefined') Report.answer({ topic: this.topic.key, level: this.level, subtopic: this.current.subtopic,
        correct: !!opt.correct, chosen: String(opt.text), why: opt.why || '', timeMs: Date.now() - (this._shownAt || Date.now()), mode: this.mode });
    } catch (e) {}
    if (this.mode === 'exam' && this.health <= 0) setTimeout(() => UI.showResult(false), 1200);
  },

  /* ---------- «Հաջորդը» կոճակ ---------- */

  continue() {
    if (this.mode === 'exam' && this.health <= 0) return;

    if (this.reviewQueue) {
      if (!this.reviewQueue.length) { UI.showResult(true); return; }
      this.next(); return;
    }

    const wasWrong = !this.lastWasCorrect();
    if (wasWrong && this.mode === 'practice' && CONFIG.practiceRetrySameSubtopic) {
      this.retrySame(); return;      // նույն տիպից նոր խնդիր՝ մինչև սովորի
    }

    if (this.correct >= this.requiredForLevel) {
      this.level++;
      this.correct = 0;
      if (this.level > CONFIG.levels) {
        Progress.complete(this.topic.key);
        UI.showResult(true); return;
      }
      Progress.reachLevel(this.topic.key, this.level);
      this.refillPool();
    }
    this.next();
  },

  lastWasCorrect() { return this._lastCorrect === true; }
};


/* ===== 50_ui.js ===== */
/* ============================================================
   ՄԻՋԵՐԵՍ — միակ մոդուլը, որ դիպչում է էջին։
   ============================================================ */

const $ = (id) => document.getElementById(id);

// Հայկական գրառում. տասնորդական կետը դառնում է ստորակետ
const fmtVal = (v) => (typeof v === 'number' ? String(v).replace('.', ',') : fmtText(String(v)));
/* Տասնորդական կետ → ստորակետ ցուցադրման պահին (հայկական նշագրում).
   Բանաձևում ($…$)՝ {,} (KaTeX-ում առանց ավելորդ բացատի), տեքստում՝ «,»։ HTML թեգերին չի դիպչում։ */
function fmtText(s) {
  if (s == null) return '';
  const NUM = /(?<![\d.§])(\d+)\.(\d+)(?![\d.])/g;
  return String(s).split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part :
    part.split(/(\$[^$]*\$)/).map(seg => seg.startsWith('$') ? seg.replace(NUM, '$1{,}$2') : seg.replace(NUM, '$1,$2')).join('')
  ).join('');
}

const UI = {

  /* ---------- Գլխավոր մենյու ---------- */

  initMenu() {
    Progress.load();
    const grid = $('topics-grid');
    grid.innerHTML = '';

    // Դասարանի զտիչ։ Ընտրությունը հիշվում է, որ աշակերտը ամեն անգամ
    // նորից չընտրի։ 0 = «բոլոր դասարանները»։
    const gsel = $('grade-select');
    if (gsel && !gsel.dataset.ready) {
      gsel.value = Progress.getGrade();
      gsel.onchange = () => { Progress.setGrade(gsel.value); UI.initMenu(); };
      gsel.dataset.ready = '1';
    }
    const grade = Number(Progress.getGrade());

    let keys = Object.keys(REGISTRY).filter(k => CONFIG.subjects[REGISTRY[k].subject].enabled);
    // Զտում ենք ՄԻԱՅՆ եթե թեման ունի grades դաշտ. առանց դաշտի թեման
    // միշտ երևում է (որ ապագա առարկան պատահաբար չանհետանա)։
    if (grade) keys = keys.filter(k => !REGISTRY[k].grades || REGISTRY[k].grades.includes(grade));
    try { if (typeof Report !== 'undefined') keys = Report.filterTopics(keys); } catch (e) {}   // հասանելիություն ըստ աշակերտի (լոգինով)

    const note = $('grade-note');
    if (note) {
      note.innerText = grade
        ? `${grade}-${grade === 1 ? 'ին' : 'րդ'} դասարանի ծրագրից՝ ${keys.length} թեմա`
        : '';
    }

    keys.forEach(key => {
      const t = REGISTRY[key];
      const p = Progress.get(key);
      const stars = '★'.repeat(p.best ? p.best : 0) + '☆'.repeat(Math.max(0, CONFIG.levels - (p.best || 0)));
      // ՈՒՇԱԴՐՈՒԹՅՈՒՆ. քարտն ինքը <div> է, ոչ թե <button>։ Նախկինում
      // ամբողջ քարտը մեկ մեծ կոճակ էր, բայց «📖 Տեսություն» հղումը
      // կոճակի ՄԵՋ դնելը անվավեր HTML է (կոճակի մեջ կոճակ/հղում) և
      // կոտրում է ստեղնաշարով նավարկելը։ Ուստի քարտը տարա է, որի
      // ներսում 2 առանձին ինտերակտիվ տարր կա. խաղը սկսող կոճակ և
      // ուղեցույցի հղում։
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl shadow-sm hover:shadow-md transition border border-slate-200 hover:border-blue-400 flex flex-col';

      const playBtn = document.createElement('button');
      playBtn.className = 'text-left p-5 pb-3 flex-grow rounded-t-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-inset';
      playBtn.innerHTML =
        `<div class="flex items-start justify-between mb-2">
           <span class="text-3xl">${t.icon}</span>
           <span class="text-amber-400 text-sm tracking-tight">${stars}${p.done ? ' 🏆' : ''}</span>
         </div>
         <h3 class="text-lg font-bold text-slate-800 mb-1">${t.title}</h3>
         <p class="text-sm text-slate-500 leading-snug">${t.desc}</p>
         <p class="text-xs text-slate-400 mt-3">${t.tasks.length} խնդրի տեսակ</p>`;
      playBtn.onclick = () => Engine.startTopic(key, $('mode-select').value);
      card.appendChild(playBtn);

      // Ուղեցույցի հղում — միայն եթե թեման ունի `theory` դաշտ։
      if (t.theory) {
        const link = document.createElement('a');
        link.href = CONFIG.theoryDir + t.theory;
        link.target = '_blank';          // նոր tab — խաղի ընթացքը չի կորչում
        link.rel = 'noopener';
        link.className = 'mx-5 mb-4 px-3 py-2 text-sm font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg text-center block focus:outline-none focus:ring-2 focus:ring-blue-500';
        link.innerText = '📖 Տեսություն';
        // Բոլոր 19 հղումն ունեն նույն տեսանելի տեքստը, ուստի screen
        // reader-ի համար նշում ենք՝ ո՛ր թեմայի ուղեցույցն է։
        link.setAttribute('aria-label', `Տեսություն. ${t.title}`);
        card.appendChild(link);
      }

      grid.appendChild(card);
    });

    const rb = $('review-btn');
    if (Progress.mistakes.length) {
      rb.classList.remove('hidden');
      $('review-count').innerText = Progress.mistakes.length;
    } else rb.classList.add('hidden');

    this.showMenu();
  },

  showMenu() {
    $('view-game').classList.add('hidden');
    $('view-result').classList.add('hidden');
    $('stats-bar').classList.add('hidden');
    $('view-menu').classList.remove('hidden');
    this.initMenuRefresh();
  },
  initMenuRefresh() { /* քարտերի աստղերը թարմացնելու համար */ },

  showGame() {
    $('view-menu').classList.add('hidden');
    $('view-result').classList.add('hidden');
    $('stats-bar').classList.remove('hidden');
    $('view-game').classList.remove('hidden');
    this.stats();
  },

  /* ---------- Վիճակագրության գոտի ---------- */

  stats() {
    $('topic-name').innerText = Engine.topic.title;

    // Ուղեցույցի հղում խաղի ընթացքում։ Կրկնության ռեժիմում («Կրկնել իմ
    // սխալները») թեման փոխվում է հարցից հարց, ուստի հղումը ամեն անգամ
    // վերահաշվարկվում է ընթացիկ թեմայից, ոչ թե մեկ անգամ խաղի սկզբում։
    const th = $('theory-link');
    if (Engine.topic.theory) {
      th.href = CONFIG.theoryDir + Engine.topic.theory;
      th.setAttribute('aria-label', `Տեսություն. ${Engine.topic.title}`);
      th.classList.remove('hidden');
    } else {
      th.classList.add('hidden');
    }

    $('mode-badge').innerText = Engine.mode === 'practice' ? 'Սովորել' : 'Ինքնաստուգում';
    { const mh = $('mode-hint'); if (mh) mh.classList.toggle('hidden', Engine.mode !== 'practice'); }
    $('mode-badge').className = 'text-xs font-bold px-2 py-0.5 rounded ' +
      (Engine.mode === 'practice' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700');

    if (Engine.reviewQueue) {
      $('level-num').innerText = '—';
      $('task-num').innerText = `${Progress.mistakes.length} մնաց`;
    } else {
      $('level-num').innerText = `${Engine.level} / ${CONFIG.levels}`;
      $('task-num').innerText = `${Engine.correct} / ${Engine.requiredForLevel}`;
    }

    const hp = $('health');
    if (Engine.mode === 'exam' && !Engine.reviewQueue) {
      hp.classList.remove('hidden');
      hp.innerHTML = '';
      for (let i = 0; i < CONFIG.startingHealth; i++)
        hp.innerHTML += `<span class="${i < Engine.health ? '' : 'opacity-25'}">❤️</span>`;
    } else hp.classList.add('hidden');

    const total = Engine.topic.tasks.length;
    let done = Engine.correct;
    for (let L = 1; L < Engine.level; L++) done += tasksOf(Engine.topic, L).length;
    $('progress-bar').style.width = Math.min(100, Math.round(done / total * 100)) + '%';
  },

  /* ---------- Խնդրի ցուցադրում ---------- */

  renderTask(task, options) {
    // Ամեն նոր հարցի հետ թարմացնում ենք վերևի գոտին։ Սա պարտադիր է
    // կրկնության ռեժիմի համար, որտեղ ընթացիկ թեման փոխվում է հարցից
    // հարց. առանց սրա և՛ թեմայի անունը, և՛ ուղեցույցի հղումը մեկ հարց
    // հետ էին մնում (այս սխալը գոյություն ուներ նաև մինչ ուղեցույցի
    // կոճակի ավելացումը՝ topic-name-ի վրա)։
    this.stats();

    // BLOOM. Պիտակը միտումնավոր ՉԻ ցուցադրվում (v2.0, 2026-08)։ Պատճառը՝
    // ընթացիկ bloom-արժեքները մասամբ օգտագործվել են որպես դժվարության
    // հոմանիշ, ոչ թե իրական ճանաչողական մակարդակ (օր. «Գնահատում»
    // պարագծի հաշվարկի համար)։ Տվյալները ՊԱՀՎՈՒՄ ԵՆ ամեն task-ում՝
    // հետագա ձեռքով վերադասակարգման համար (տես ՎԻՃԱԿ.md §6)։ Երբ
    // վերադասակարգումն ավարտվի, բավական է վերականգնել ստորև 2 տողը։
    // $('bloom').innerText = task.bloom;
    // $('bloom').className = 'text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full ' + task.badgeClass;
    $('subtopic').innerText = task.subtopic;
    $('question').innerHTML = fmtText(task.q);

    const grid = $('options');
    grid.innerHTML = '';
    options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt text-left p-4 border-2 border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition flex items-center gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500';
      b.innerHTML =
        `<span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm font-bold text-slate-500 shrink-0">${String.fromCharCode(65 + i)}</span>
         <span class="math">${fmtVal(opt.text)}</span>`;
      b.onclick = () => Engine.answer(opt, b);
      grid.appendChild(b);
    });

    $('feedback').classList.add('hidden');
    this.typeset();
  },

  lockOptions() { document.querySelectorAll('.opt').forEach(b => b.disabled = true); },

  /* ---------- Հետադարձ կապ ---------- */

  feedback(ok, task, why, btn) {
    const box = $('feedback');
    btn.classList.add(ok ? 'bg-green-100' : 'bg-red-50', ok ? 'border-green-500' : 'border-red-400');

    if (!ok) {
      document.querySelectorAll('.opt').forEach(b => {
        if (b.querySelector('.math').innerHTML === fmtVal(task.ans))
          b.classList.add('border-green-500', 'bg-green-50');
      });
    }

    let html = '';
    if (!ok && why && CONFIG.showMisconceptionOnWrong) {
      html += `<div class="mb-3 p-3 bg-white rounded-lg border-l-4 border-amber-400">
                 <p class="text-xs font-bold text-amber-700 uppercase tracking-wide mb-1">Այս տարբերակը ընտրողը սովորաբար</p>
                 <p class="text-slate-700">${fmtText(why)}</p>
               </div>`;
    }
    html += `<div class="math">${fmtText(task.rationale)}</div>`;

    box.className = 'mt-6 rounded-xl p-5 border-l-4 ' +
      (ok ? 'bg-green-50 border-green-500' : 'bg-amber-50 border-amber-500');
    $('fb-title').innerText = ok ? '✅ Ճիշտ է' : '💡 Դիտիր լուծումը';
    $('fb-title').className = 'font-bold text-lg mb-3 ' + (ok ? 'text-green-800' : 'text-amber-800');
    $('fb-body').innerHTML = html;

    const nb = $('next-btn');
    if (Engine.mode === 'exam' && Engine.health <= 0) nb.classList.add('hidden');
    else {
      nb.classList.remove('hidden');
      nb.innerText = (!ok && Engine.mode === 'practice' && CONFIG.practiceRetrySameSubtopic)
        ? 'Փորձել նույն տեսակից ➔' : 'Հաջորդը ➔';
    }
    box.classList.remove('hidden');
    this.typeset();
  },

  /* ---------- Ավարտ ---------- */

  showResult(win) {
    try { if (typeof Report !== 'undefined') Report.result({ topic: Engine.topic && Engine.topic.key, level: Engine.level, correct: win ? 1 : 0, mode: Engine.mode }); } catch (e) {}
    $('view-game').classList.add('hidden');
    $('stats-bar').classList.add('hidden');
    $('view-result').classList.remove('hidden');
    $('res-icon').innerText = win ? '🏆' : '💔';
    $('res-title').innerText = win ? 'Ապրե՛ս' : '3 սխալ — ինքնաստուգումը չհաջողվեց';
    $('res-desc').innerText = win
      ? `«${Engine.topic.title}» թեման ավարտված է։`
      : 'Դիտիր լուծումները և փորձիր նորից։ «Սովորել» ռեժիմում սխալը չի պատժվում. երբ վստահ լինես, փորձիր «Ինքնաստուգում»-ը։';
  },

  showBroken(info) {
    $('question').innerHTML =
      `⚠️ Այս խնդրի գեներատորը սխալ է կառուցված («${info.subtopic}»)։ Պատճառ. ${info.reason}`;
    $('options').innerHTML = '';
  },

  /* ---------- MathJax ---------- */

  typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise().catch(() => {});
    }
  }
};


/* ===== 60_speed.js ===== */
/* ============================================================
   ⚡ ԱՐԱԳ ՀԱՇՎԱՐԿ — բանավոր հաշվարկի արագության տրենաժոր (v2)
   Ինքնուրույն մոդուլ. Engine/REGISTRY-ին չի դիպչում։ Բացվում է ՄԻԱՅՆ գլխավոր էջի կոճակով։
   - Գործողություններ՝ +, −, ×, : և խառը; միջակայք՝ մինչև 100 / 1000 / 10000 (բոլոր գործողությունները)
   - 5 ԱՍՏԻՃԱՆ ամեն ռեժիմում. աստիճանն անցնելու համար՝ ճշտություն ≥ 90% և միջին ժամանակ ≤ աստիճանի շեմ
   - Արագության սանդղակ (1–5), ընթացիկ աստիճանը պահվում է (localStorage), պատմություն (վերջին 50 սեսիա)
   - Կիսատ թողնված սեսիան (≥5 պատասխան) նույնպես գրանցվում է
   - Հաշվետվություն՝ Report.speed(...) (եթե միացված է)
   Շեմերը փոխելու համար՝ BASE (1-ին աստիճանի ժամանակը, վրկ) և STAGE_K (ամեն աստիճանի գործակիցը)։
   ============================================================ */

const Speed = {
  STORE: 'trenajor_speed_v2',
  N: 20,                                   // հարցերի քանակը մեկ սեսիայում
  PASS_ACC: 0.9,                           // աստիճանն անցնելու ճշտություն
  // 1-ին աստիճանի ժամանակային շեմ (վրկ)՝ ըստ գործողության և միջակայքի
  BASE: { add100:11, sub100:11, mul100:8,  div100:8,
          add1000:18, sub1000:18, mul1000:15, div1000:15,
          add10000:30, sub10000:30, mul10000:25, div10000:25 },
  STAGE_K: [1, 0.8, 0.65, 0.5, 0.4],       // աստիճաններ 1–5. շեմ = BASE × գործակից
  OPS: [
    { id:'add', label:'+ Գումարում' }, { id:'sub', label:'− Հանում' }, { id:'as', label:'± Գումարում և հանում' },
    { id:'mul', label:'× Բազմապատկում' }, { id:'div', label:': Բաժանում' }, { id:'md', label:'×: Բազմապատկում և բաժանում' },
    { id:'all', label:'Բոլորը' }
  ],
  RANGES: [100, 1000, 10000],
  op: 'mul', range: 100,

  /* ---------- Հարցերի գեներացում (մաքուր ֆունկցիաներ՝ թեստավորելի) ---------- */
  rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  makeFact(kind, range) {
    const r = this.rnd.bind(this); let a, b;
    const cat = kind + range;
    if (kind === 'add') {
      const lo = range === 100 ? 2 : range === 1000 ? 12 : 102;
      do { a = r(lo, range - lo); b = r(lo, range - lo); } while (a + b > range);
      return { kind, cat, a, b, sym:'+', ans:a + b };
    }
    if (kind === 'sub') {
      const lo = range === 100 ? 11 : range === 1000 ? 101 : 1001, blo = range === 100 ? 2 : range === 1000 ? 11 : 101;
      a = r(lo, range); b = r(blo, a - 1);
      return { kind, cat, a, b, sym:'−', ans:a - b };
    }
    // բազմապատկում/բաժանում. 100՝ աղյուսակ; 1000՝ երկնիշ×միանիշ; 10000՝ եռանիշ×միանիշ կամ երկնիշ×երկնիշ
    let x, y;
    if (range === 100) { x = r(2, 10); y = r(2, 10); }
    else if (range === 1000) { x = r(11, 99); y = r(2, 9); }
    else if (Math.random() < 0.5) { x = r(101, 999); y = r(2, 9); if (x * y > 10000) { x = r(101, 999); y = r(2, Math.max(2, Math.floor(10000 / x))); } }
    else { do { x = r(11, 99); y = r(11, 99); } while (x * y > 10000); }
    if (kind === 'mul') return Math.random() < 0.5 ? { kind, cat, a:x, b:y, sym:'·', ans:x * y } : { kind, cat, a:y, b:x, sym:'·', ans:x * y };
    return { kind, cat, a:x * y, b:y, sym:':', ans:x };                   // div՝ ամբողջ քանորդ
  },
  kindsFor(op) { return op === 'as' ? ['add','sub'] : op === 'md' ? ['mul','div'] : op === 'all' ? ['add','sub','mul','div'] : [op]; },
  nextFact() {
    const due = this.retry.findIndex(x => x.dueAt <= this.i);              // սխալվածը՝ 3 հարց հետո
    if (due >= 0) return this.retry.splice(due, 1)[0].fact;
    const kinds = this.kindsFor(this.op); let f, g = 0;
    do { f = this.makeFact(kinds[this.rnd(0, kinds.length - 1)], this.range); }
    while (this.last && f.a === this.last.a && f.b === this.last.b && ++g < 10);
    return f;
  },

  /* ---------- Աստիճաններ ---------- */
  ratio(r) { return r.sec / this.BASE[r.cat]; },                           // 1 = 1-ին աստիճանի շեմ
  speedLevel(med) { let lv = 0; this.STAGE_K.forEach((k, i) => { if (med <= k) lv = i + 1; }); return lv; },   // 0–5
  evaluate(results, stage) {
    const n = results.length || 1, ok = results.filter(r => r.ok);
    const acc = ok.length / n;
    const rs = ok.map(r => this.ratio(r)).sort((x, y) => x - y);
    const medR = rs.length ? rs[Math.floor((rs.length - 1) / 2)] : 99;
    const secs = ok.map(r => r.sec).sort((x, y) => x - y);
    const med = secs.length ? secs[Math.floor((secs.length - 1) / 2)] : 0;
    const speedLvl = this.speedLevel(medR);
    const passed = results.length >= this.N && acc >= this.PASS_ACC && speedLvl >= stage;
    return { acc, med, medR, speedLvl, passed };
  },

  /* ---------- Պահպանում ---------- */
  load() { try { return JSON.parse(localStorage.getItem(this.STORE)) || { modes:{}, history:[] }; } catch (e) { return { modes:{}, history:[] }; } },
  save(d) { try { localStorage.setItem(this.STORE, JSON.stringify(d)); } catch (e) {} },
  key() { return this.op + '_' + this.range; },
  stageOf(d) { return ((d.modes[this.key()] || {}).stage) || 1; },
  targetSec(stage) {                                                         // մեկ գործողությամբ ռեժիմի շեմը վայրկյաններով
    const ks = this.kindsFor(this.op); if (ks.length > 1) return null;
    return Math.round(this.BASE[ks[0] + this.range] * this.STAGE_K[stage - 1] * 10) / 10;
  },

  /* ---------- UI ---------- */
  el(id) { return document.getElementById(id); },
  ensureView() {
    if (this.el('view-speed')) return;
    const s = document.createElement('section');
    s.id = 'view-speed'; s.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-8 hidden fade';
    document.getElementById('view-menu').parentNode.appendChild(s);
  },
  show(html) {
    this.ensureView();
    ['view-menu','view-game','view-result'].forEach(id => { const e = this.el(id); if (e) e.classList.add('hidden'); });
    const sb = this.el('stats-bar'); if (sb) sb.classList.add('hidden');
    const v = this.el('view-speed'); v.innerHTML = html; v.classList.remove('hidden');
  },
  close() {
    clearInterval(this.tick);
    if (this.running && this.results && this.results.length >= 5) this.record(true);   // կիսատ սեսիա
    this.running = false;
    const v = this.el('view-speed'); if (v) v.classList.add('hidden');
    UI.initMenu();
  },
  scale(stage, lvl) {                                                        // 1–5 սանդղակ
    return `<div class="flex gap-1 my-2">${[1,2,3,4,5].map(i => {
      const t = this.targetSec(i);
      const cls = i <= lvl ? 'bg-green-500 text-white' : i === stage ? 'bg-blue-100 text-blue-800 border-2 border-blue-500' : 'bg-slate-100 text-slate-500';
      return `<div class="flex-1 rounded-lg py-1 text-center text-xs font-bold ${cls}">${i}${t ? `<div class="font-normal">≤${String(t).replace('.', ',')} վ</div>` : ''}</div>`; }).join('')}</div>`;
  },

  open() {
    const d = this.load(), stage = this.stageOf(d);
    const chip = (o) => `<button data-op="${o.id}" class="sp-op px-3 py-2 rounded-lg border text-sm font-semibold ${o.id === this.op ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-300 hover:bg-slate-50'}">${o.label}</button>`;
    const rchip = (r) => `<button data-r="${r}" class="sp-r px-3 py-2 rounded-lg border text-sm font-semibold ${r === this.range ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-300 hover:bg-slate-50'}">Մինչև ${r === 10000 ? '10 000' : r}</button>`;
    const hist = d.history.filter(h => h.key === this.key()).slice(-5).reverse();
    this.show(`
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold">⚡ Արագ հաշվարկ</h2>
        <button id="sp-close" class="text-sm text-slate-500 hover:text-slate-800">← Գլխավոր էջ</button>
      </div>
      <p class="text-slate-600 mb-5">Պատասխանիր <b>ճիշտ և արագ</b>։ Սեսիա՝ ${this.N} հարց։ Աստիճանն անցնելու համար պետք է <b>≥ 90% ճշտություն</b> և միջին ժամանակ՝ աստիճանի շեմից ոչ ավելի։</p>
      <div class="mb-4"><div class="text-sm text-slate-500 mb-2">Գործողություն</div><div class="flex flex-wrap gap-2">${this.OPS.map(chip).join('')}</div></div>
      <div class="mb-5"><div class="text-sm text-slate-500 mb-2">Միջակայք</div><div class="flex flex-wrap gap-2">${this.RANGES.map(rchip).join('')}</div></div>
      <div class="rounded-xl bg-slate-50 border border-slate-200 p-4 mb-5 text-sm text-slate-700">
        <div>Քո ընթացիկ աստիճանը այս ռեժիմում՝ <b class="text-blue-700 text-lg">${stage} / 5</b></div>
        ${this.scale(stage, stage - 1)}
        ${hist.length ? `<div class="mt-2 text-slate-500">Վերջին սեսիաներ.</div>${hist.map(h => `<div>${h.date} · աստիճան ${h.stage} · ${Math.round(h.acc * 100)}% · ${String(h.med.toFixed(1)).replace('.', ',')} վրկ ${h.passed ? '✅' : h.partial ? '⏸ կիսատ' : ''}</div>`).join('')}` : '<div class="mt-2 text-slate-500">Այս ռեժիմում դեռ սեսիա չունես։</div>'}
      </div>
      <button id="sp-start" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-lg">Սկսել (աստիճան ${stage})</button>`);
    this.el('sp-close').onclick = () => this.close();
    document.querySelectorAll('.sp-op').forEach(x => x.onclick = () => { this.op = x.dataset.op; this.open(); });
    document.querySelectorAll('.sp-r').forEach(x => x.onclick = () => { this.range = Number(x.dataset.r); this.open(); });
    this.el('sp-start').onclick = () => this.start();
  },

  start() {
    this.i = 0; this.results = []; this.retry = []; this.streak = 0; this.bestStreak = 0; this.last = null; this.running = true;
    this.stage = this.stageOf(this.load());
    const t = this.targetSec(this.stage);
    this.show(`
      <div class="flex items-center justify-between mb-3 text-sm text-slate-600">
        <span>Աստիճան <b>${this.stage}</b>${t ? ` (≤${String(t).replace('.', ',')} վ)` : ''} · Հարց <b id="sp-n">1</b>/${this.N}</span>
        <span>🔥 <b id="sp-streak">0</b></span>
        <span>⏱ <b id="sp-t">0,0</b> վ</span>
      </div>
      <div class="h-2 bg-slate-100 rounded mb-6 overflow-hidden"><div id="sp-bar" class="h-full bg-blue-500 transition-all" style="width:0"></div></div>
      <div id="sp-q" class="text-center text-4xl md:text-6xl font-bold tracking-wide mb-6 select-none"></div>
      <div class="flex justify-center mb-3"><input id="sp-in" inputmode="numeric" autocomplete="off" class="w-52 text-center text-3xl font-bold border-2 border-slate-300 rounded-xl py-2 focus:outline-none focus:border-blue-500" /></div>
      <div id="sp-fb" class="text-center min-h-8 text-lg font-semibold mb-3"></div>
      <div id="sp-pad" class="grid grid-cols-3 gap-2 max-w-xs mx-auto">
        ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-k="${d}" class="sp-k py-3 rounded-lg bg-slate-100 hover:bg-slate-200 text-xl font-bold">${d}</button>`).join('')}
        <button data-k="del" class="sp-k py-3 rounded-lg bg-slate-100 hover:bg-slate-200 text-xl">⌫</button>
        <button data-k="0" class="sp-k py-3 rounded-lg bg-slate-100 hover:bg-slate-200 text-xl font-bold">0</button>
        <button data-k="ok" class="sp-k py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xl font-bold">✓</button>
      </div>
      <div class="text-center mt-5"><button id="sp-stop" class="text-sm text-slate-500 hover:text-slate-800">Ավարտել</button></div>`);
    const inp = this.el('sp-in');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') this.submit(); });
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 6); });
    document.querySelectorAll('.sp-k').forEach(k => k.onclick = () => {
      const v = k.dataset.k;
      if (v === 'ok') this.submit(); else if (v === 'del') inp.value = inp.value.slice(0, -1); else inp.value = (inp.value + v).slice(0, 6);
      inp.focus();
    });
    this.el('sp-stop').onclick = () => this.results.length >= 5 ? this.finish(true) : (this.running = false, this.open());
    this.ask();
  },
  fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); },      // 10 000 (բացատով)
  ask() {
    const f = this.nextFact(); this.cur = f; this.last = f; this.locked = false;
    this.el('sp-q').textContent = `${this.fmt(f.a)} ${f.sym} ${this.fmt(f.b)} = ?`;
    this.el('sp-n').textContent = Math.min(this.i + 1, this.N);
    this.el('sp-bar').style.width = (this.i / this.N * 100) + '%';
    const inp = this.el('sp-in'); inp.value = ''; inp.focus();
    this.el('sp-fb').textContent = '';
    this.t0 = performance.now(); clearInterval(this.tick);
    this.tick = setInterval(() => { const e = this.el('sp-t'); if (e) e.textContent = ((performance.now() - this.t0) / 1000).toFixed(1).replace('.', ','); }, 100);
  },
  hint(f) {
    if (f.kind === 'mul' && f.a <= 10 && f.b <= 10) return f.b > 2 ? `${f.a}·${f.b} = ${f.a}·${f.b - 1} + ${f.a}` : '';
    if (f.kind === 'mul') { const big = Math.max(f.a, f.b), sm = Math.min(f.a, f.b); const t = Math.floor(big / 10) * 10, u = big % 10; return u && sm < 10 ? `${t}·${sm} + ${u}·${sm} = ${t * sm} + ${u * sm}` : ''; }
    if (f.kind === 'div') return `քանի որ ${this.fmt(f.ans)}·${f.b} = ${this.fmt(f.a)}`;
    const t = Math.floor(f.b / 10) * 10, u = f.b % 10;
    if (f.kind === 'add') return t && u ? `${this.fmt(f.a)} + ${this.fmt(t)} = ${this.fmt(f.a + t)}, հետո + ${u}` : '';
    if (f.kind === 'sub') return t && u ? `${this.fmt(f.a)} − ${this.fmt(t)} = ${this.fmt(f.a - t)}, հետո − ${u}` : '';
    return '';
  },
  submit() {
    if (this.locked || !this.running) return;
    const inp = this.el('sp-in'); if (inp.value === '') return;
    this.locked = true; clearInterval(this.tick);
    const sec = (performance.now() - this.t0) / 1000, f = this.cur, ok = Number(inp.value) === f.ans;
    this.results.push({ q:`${this.fmt(f.a)} ${f.sym} ${this.fmt(f.b)}`, ans:f.ans, given:Number(inp.value), ok, sec, cat:f.cat });
    this.i++;
    const fb = this.el('sp-fb');
    if (ok) {
      this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak);
      const r = sec / this.BASE[f.cat], lv = this.speedLevel(r);
      fb.className = 'text-center min-h-8 text-lg font-semibold mb-3 text-green-600';
      fb.textContent = lv >= this.stage ? (lv === 5 ? '✓ Կայծակնային!' : '✓ Ճիշտ և արագ') : '✓ Ճիշտ — փորձիր ավելի արագ';
    } else {
      this.streak = 0; this.retry.push({ fact:f, dueAt:this.i + 3 });
      fb.className = 'text-center min-h-8 text-lg font-semibold mb-3 text-red-600';
      const h = this.hint(f);
      fb.textContent = `✗ ${this.fmt(f.a)} ${f.sym} ${this.fmt(f.b)} = ${this.fmt(f.ans)}` + (h ? `  (${h})` : '');
    }
    this.el('sp-streak').textContent = this.streak;
    setTimeout(() => { if (!this.running) return; if (this.i >= this.N) this.finish(false); else this.ask(); }, ok ? 350 : 1600);
  },
  record(partial) {
    const R = this.results, ev = this.evaluate(R, this.stage);
    const d = this.load(), k = this.key();
    const m = d.modes[k] || (d.modes[k] = { stage:1 });
    const prevStage = m.stage || 1;
    if (ev.passed && !partial) m.stage = Math.min(5, prevStage + 1);
    if (!m.best || ev.speedLvl > m.best.speedLvl || (ev.speedLvl === m.best.speedLvl && ev.acc > m.best.acc)) m.best = { speedLvl:ev.speedLvl, acc:ev.acc, med:ev.med };
    const weak = R.filter(r => !r.ok || this.speedLevel(r.sec / this.BASE[r.cat]) < this.stage).sort((a, b) => (a.ok - b.ok) || (b.sec - a.sec)).slice(0, 6);
    d.history.push({ date:new Date().toISOString().slice(0, 16).replace('T', ' '), key:k, stage:prevStage, n:R.length, acc:ev.acc, med:ev.med, speedLvl:ev.speedLvl, passed:ev.passed && !partial, partial:!!partial });
    d.history = d.history.slice(-50); this.save(d);
    try { if (typeof Report !== 'undefined') Report.speed({ mode:k, stage:prevStage, n:R.length, acc:ev.acc, med:ev.med, speedLvl:ev.speedLvl, passed:ev.passed && !partial, partial:!!partial, bestStreak:this.bestStreak, weak:weak.map(w => w.q) }); } catch (e) {}
    return { ev, prevStage, newStage:m.stage, weak };
  },
  finish(partial) {
    clearInterval(this.tick); this.running = false;
    const { ev, prevStage, newStage, weak } = this.record(partial);
    const t = this.targetSec(prevStage);
    const msg = partial ? `<div class="text-slate-600 mb-2">⏸ Սեսիան կիսատ է (${this.results.length}/${this.N}). արդյունքը պահվեց, բայց աստիճանը չի փոխվում։</div>`
      : ev.passed ? `<div class="text-green-700 font-bold text-xl mb-2">✅ Աստիճան ${prevStage}-ն անցար!${newStage > prevStage ? ` Նոր աստիճան՝ ${newStage}` : ' Սա ամենաբարձր աստիճանն է 🏆'}</div>`
      : `<div class="text-amber-700 font-bold text-lg mb-2">Աստիճան ${prevStage}-ը դեռ չանցար</div>
         <div class="text-sm text-slate-600 mb-2">Պետք է. ճշտություն ≥ 90% ${ev.acc >= this.PASS_ACC ? '✅' : '❌'} և արագության մակարդակ ≥ ${prevStage} ${ev.speedLvl >= prevStage ? '✅' : '❌'}${t ? ` (միջին ≤ ${String(t).replace('.', ',')} վրկ)` : ''}</div>`;
    this.show(`
      <div class="text-center">
        ${msg}
        <div class="grid grid-cols-3 gap-3 max-w-md mx-auto my-4">
          <div class="bg-slate-50 rounded-xl p-3"><div class="text-2xl font-bold">${Math.round(ev.acc * 100)}%</div><div class="text-xs text-slate-500">ճշտություն</div></div>
          <div class="bg-slate-50 rounded-xl p-3"><div class="text-2xl font-bold">${ev.med.toFixed(1).replace('.', ',')}</div><div class="text-xs text-slate-500">միջին վրկ</div></div>
          <div class="bg-slate-50 rounded-xl p-3"><div class="text-2xl font-bold">${this.bestStreak}</div><div class="text-xs text-slate-500">լավագույն շարք</div></div>
        </div>
        <div class="max-w-md mx-auto text-left text-sm text-slate-600">Քո արագությունը սանդղակի վրա՝ <b>${ev.speedLvl} / 5</b>${this.scale(newStage, ev.speedLvl)}</div>
        ${weak.length ? `<div class="text-left max-w-md mx-auto bg-amber-50 border border-amber-200 rounded-xl p-4 my-4"><div class="font-semibold mb-2">Կրկնիր սրանք.</div>${weak.map(w => `<div class="text-sm">${w.ok ? '🐢' : '✗'} ${w.q} = <b>${this.fmt(w.ans)}</b> ${w.ok ? `(${w.sec.toFixed(1).replace('.', ',')} վրկ)` : `(քո պատասխանը՝ ${this.fmt(w.given)})`}</div>`).join('')}</div>` : ''}
        <div class="flex justify-center gap-3 flex-wrap mt-4">
          <button id="sp-again" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Նորից</button>
          <button id="sp-back" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl">Փոխել ռեժիմը</button>
          <button id="sp-home" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl">Գլխավոր էջ</button>
        </div>
      </div>`);
    this.el('sp-again').onclick = () => this.start();
    this.el('sp-back').onclick = () => this.open();
    this.el('sp-home').onclick = () => this.close();
  }
};


/* ===== 70_report.js ===== */
/* ============================================================
   📊 ԼՈԳԻՆ ԵՎ ՀԱՇՎԵՏՎՈՒԹՅՈՒՆ (ըստ ցանկության)
   ԼՌԵԼՅԱՅՆ ԱՆՋԱՏՎԱԾ է. առանց կարգավորման ոչինչ չի անում և ոչինչ չի ուղարկում։

   Միացնելու համար՝ index.html-ի կողքին դիր `trenajor-config.js` ֆայլ.
       window.TRENAJOR_CONFIG = {
         reportUrl: "https://script.google.com/macros/s/XXXX/exec",   // Apps Script-ի հասցե
         loginRequired: true                                           // պահանջե՞լ լոգին
       };
   Սերվերային մասը (Google Sheets + Apps Script)՝ docs/apps_script/Code.gs,
   տեղադրման հրահանգը՝ docs/ՀԱՇՎԵՏՎՈՒԹՅՈՒՆ_ԵՎ_ԼՈԳԻՆ.md

   ԱԶՆԻՎ ՆՇՈՒՄ. GitHub Pages-ում լոգինը աշակերտին ՃԱՆԱՉԵԼՈՒ և հաշվետվության
   համար է, ոչ թե բովանդակությունը գաղտնի պահելու։ Իրական պաշտպանության համար
   տես նույն ուղեցույցի «Իրական պաշտպանություն» բաժինը (Cloudflare Access)։
   ============================================================ */

const Report = {
  cfg() { return (typeof window !== 'undefined' && window.TRENAJOR_CONFIG) || {}; },
  enabled() { return !!this.cfg().reportUrl; },
  KEY: 'trenajor_user_v1',
  queue: [],

  user() { try { return JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { return null; } },
  setUser(u) { try { u ? localStorage.setItem(this.KEY, JSON.stringify(u)) : localStorage.removeItem(this.KEY); } catch (e) {} },

  async call(payload) {
    const r = await fetch(this.cfg().reportUrl, {
      method: 'POST',
      body: JSON.stringify(payload)            // text/plain → առանց CORS preflight-ի
    });
    return r.json();
  },

  /* ---------- Լոգին ---------- */
  gate(onReady) {
    if (!this.enabled() || !this.cfg().loginRequired || this.user()) { this.badge(); onReady(); return; }
    const ov = document.createElement('div');
    ov.id = 'login-overlay';
    ov.className = 'fixed inset-0 bg-slate-900/70 flex items-center justify-center z-50 p-4';
    ov.innerHTML = `
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
        <h2 class="text-xl font-bold mb-1">Մուտք</h2>
        <p class="text-sm text-slate-500 mb-4">Մուտքանունն ու գաղտնաբառը տվել է ուսուցիչը։</p>
        <input id="lg-user" placeholder="Մուտքանուն" autocomplete="username" class="w-full border rounded-lg px-3 py-2 mb-2" />
        <input id="lg-pass" type="password" placeholder="Գաղտնաբառ" autocomplete="current-password" class="w-full border rounded-lg px-3 py-2 mb-3" />
        <div id="lg-msg" class="text-sm text-red-600 h-5 mb-2"></div>
        <button id="lg-go" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Մուտք գործել</button>
      </div>`;
    document.body.appendChild(ov);
    const go = async () => {
      const login = document.getElementById('lg-user').value.trim(), pass = document.getElementById('lg-pass').value;
      const msg = document.getElementById('lg-msg');
      if (!login || !pass) { msg.textContent = 'Լրացրու երկու դաշտն էլ'; return; }
      msg.textContent = 'Ստուգում…';
      try {
        const r = await this.call({ action: 'login', login, pass, ua: navigator.userAgent });
        if (r && r.ok) { this.setUser({ login, name: r.name, cls: r.cls, token: r.token, allow: r.allow || '' }); ov.remove(); this.badge(); onReady(); }
        else msg.textContent = 'Սխալ մուտքանուն կամ գաղտնաբառ';
      } catch (e) { msg.textContent = 'Կապ չկա սերվերի հետ. փորձիր նորից'; }
    };
    document.getElementById('lg-go').onclick = go;
    document.getElementById('lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  },

  badge() {
    const u = this.user(); if (!this.enabled() || !u) return;
    if (document.getElementById('user-badge')) return;
    const b = document.createElement('div');
    b.id = 'user-badge';
    b.className = 'fixed bottom-3 right-3 bg-white border border-slate-200 shadow rounded-full px-3 py-1 text-xs text-slate-600 z-40';
    b.innerHTML = `👤 ${u.name || u.login} · <a href="#" id="user-out" class="text-blue-600">ելք</a>`;
    document.body.appendChild(b);
    document.getElementById('user-out').onclick = (e) => { e.preventDefault(); this.flush(); this.setUser(null); location.reload(); };
    // «Ակտիվ հիմա»-ի համար՝ 3 րոպեն մեկ ազդանշան
    if (!this._hb) this._hb = setInterval(() => { this.push({ type: 'ping' }); this.flush(); }, 180000);
  },

  /* ---------- Հասանելիություն ըստ աշակերտի ----------
     «Աշակերտներ» թերթի «Հասանելիություն» սյունակ. դատարկ = բոլորը; «5,6» = միայն 5-րդ և 6-րդ դասարանների
     թեմաներ; «արագ» բառը թույլատրում է Արագ հաշվարկը (եթե սյունակը լրացված է, առանց «արագ»-ի այն թաքնված է)։
     ⚠ Սա ինտերֆեյսի սահմանափակում է. իրական պաշտպանություն՝ Cloudflare Access (տես ուղեցույցը)։ */
  allow() {
    const u = this.user(); if (!this.enabled() || !u || !u.allow) return null;
    const parts = String(u.allow).split(/[,\s;]+/).map(x => x.trim()).filter(Boolean);
    return { grades: parts.filter(x => /^\d+$/.test(x)).map(Number), speed: parts.some(x => /^արագ/.test(x)) };
  },
  filterTopics(keys) {
    const a = this.allow();
    const sb = document.getElementById('speed-btn');
    if (!a) { if (sb) sb.classList.remove('hidden'); return keys; }
    if (sb) sb.classList.toggle('hidden', !a.speed);
    if (!a.grades.length) return keys;
    return keys.filter(k => { const g = REGISTRY[k].grades; return !g || g.some(x => a.grades.includes(x)); });
  },

  /* ---------- Իրադարձություններ ---------- */
  push(ev) {
    if (!this.enabled()) return;
    const u = this.user(); if (this.cfg().loginRequired && !u) return;
    this.queue.push(Object.assign({ ts: new Date().toISOString() }, ev));
    if (this.queue.length >= 5) this.flush();
  },
  flush() {
    if (!this.enabled() || !this.queue.length) return;
    const u = this.user() || {};
    const events = this.queue.splice(0);
    const body = JSON.stringify({ action: 'log', login: u.login || 'anonymous', token: u.token || '', events });
    try {
      if (navigator.sendBeacon) navigator.sendBeacon(this.cfg().reportUrl, body);
      else fetch(this.cfg().reportUrl, { method: 'POST', body, keepalive: true });
    } catch (e) {}
  },

  answer(d) { this.push(Object.assign({ type: 'answer' }, d)); },
  speed(d)  { this.push({ type: 'speed', topic: 'speed:' + d.mode,
                          level: 'Աստիճան ' + d.stage + (d.passed ? ' ✅ անցավ' : d.partial ? ' ⏸ կիսատ' : ' — չանցավ'),
                          correct: Math.round(d.acc * 100), timeMs: Math.round(d.med * 1000),
                          extra: JSON.stringify({ n: d.n, speedLvl: d.speedLvl, bestStreak: d.bestStreak, weak: d.weak }) }); this.flush(); },
  result(d) { this.push(Object.assign({ type: 'result' }, d)); this.flush(); }
};

try {   // բեռնման պահին՝ միայն իրական բրաուզերում (թեստային միջավայրերում անվնաս բաց է թողնվում)
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') window.addEventListener('pagehide', () => Report.flush());
  if (typeof document !== 'undefined' && typeof document.addEventListener === 'function')
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Report.flush(); });
} catch (e) {}

/* Աղբյուր՝ Բազա 1-4 v12. 2-րդ դաս. §1–§10 (2.1.x–2.2.x), §20–§21 (2.4.4–2.4.5),
   3-րդ դաս. §7 (3.1.7 կլորացում), 3.2.1–3.2.3։ Bad-երը՝ բազայի «Սխալ պատասխան»-ներից
   (օր. «38 > 41», «3010/310», «45/75», «22/212», «54/46», «x=85», «x=70»)։ */

const AS_pos = (v) => (Number.isInteger(v) && v > 0 ? v : null);
// true, եթե bad-երից առնվազն 3-ը վավեր են և իրարից ու ans-ից տարբեր
const AS_ok3 = (xs, ans) => { const ok = xs.filter(x => x !== null && x !== undefined && x !== ans); return new Set(ok.map(String)).size >= 3; };

TOPIC({

tasks: [

/* ============================ LEVEL 1 ============================ */

{ level:1, subtopic:"Տասնավորներ և միավորներ", bloom:"Իմացություն", badgeClass:"lvl-1", gen(){
  let t, u; do { t = rand(1,9); u = rand(1,9); } while (t === u);
  const n = 10*t + u;
  if (Math.random() < 0.5) {
    return {
      q:`Ո՞ր թիվն ունի $${t}$ տասնավոր և $${u}$ միավոր:`,
      ans:n,
      bad:[ { v:Number(`${t}0${u}`), why:"տասնավորները գրում է որպես «$"+t+"0$» և կողքին կցագրում միավորները" },
            { v:10*u + t,           why:"տասնավորներն ու միավորները տեղերով է փոխում" },
            { v:t + u,              why:"գումարում է թվանշանները" },
            { v:10*t,               why:"մոռանում է միավորները" } ],
      rationale:`$${t}$ տասնավոր $=${10*t}$, գումարած $${u}$ միավոր. $${10*t}+${u}=${n}$։`,
      vars:{ mode:"build", t, u }
    };
  }
  return {
    q:`Քանի՞ տասնավոր կա $${n}$ թվում:`,
    ans:t,
    bad:[ { v:u,      why:"պատասխանում է միավորների թվանշանով" },
          { v:10*t,   why:"տասնավորների քանակը շփոթում է կարգային գումարելիի հետ ($"+(10*t)+"$)" },
          { v:n,      why:"պատասխանում է ամբողջ թվով" },
          { v:t + u,  why:"գումարում է թվանշանները" } ],
    rationale:`$${n}=${10*t}+${u}$, այսինքն՝ <b>$${t}$ տասնավոր</b> և $${u}$ միավոր։`,
    vars:{ mode:"count", t, u }
  };
}, verify(v){ return v.mode === "build" ? Number(String(v.t) + String(v.u)) : Math.floor((10*v.t + v.u)/10); }},

{ level:1, subtopic:"Համեմատում 100-ի սահմաններում", bloom:"Կիրառում", badgeClass:"lvl-1", gen(){
  let A, B, C, D;
  do { A = rand(2,8)*10 + rand(0,3); B = A - 10 + rand(5,9); C = rand(5,9); D = rand(A+1, 99); }
  while (B >= A || B % 10 <= A % 10 || B < 10 || D % 10 >= A % 10 && D < A || D === A);
  // A՝ «փոքր միավորներով» մեծ, B՝ «մեծ միավորներով» փոքր, C՝ միանիշ, D՝ ամենամեծը
  const nums = [A,B,C,D], asc = [...nums].sort((x,y)=>x-y);
  const byUnits = [...nums].sort((x,y)=>(x%10)-(y%10) || x-y);
  const f = (arr) => `$${arr.join(' \\lt ')}$`;
  const lex = f([C, A, B, D].sort((x,y)=> String(x).localeCompare(String(y))));
  const oneLast = f([...[A,B,D].sort((x,y)=>x-y), C]);
  if (!AS_ok3([f(byUnits), f([...asc].reverse()), lex, oneLast], f(asc))) return this.gen();
  return {
    q:`Դասավորիր աճման կարգով. $${shuffle(nums).join(';\\ ')}$`,
    ans: f(asc),
    bad:[ { v:f(byUnits),            why:"համեմատում է միայն միավորները՝ անտեսելով տասնավորները" },
          { v:f([...asc].reverse()), why:"շփոթում է աճման կարգը նվազման հետ" },
          { v:lex,     why:"համեմատում է ձախից թվանշաններով՝ չհաշվելով թվանշանների քանակը (միանիշը դնում է իր առաջին թվանշանի տեղում)" },
          { v:oneLast, why:`միանիշ թիվը ($${C}$) համարում է ամենամեծը, քանի որ նրա թվանշանը մեծ է` } ],
    rationale:`Միանիշ թիվը փոքր է ցանկացած երկնիշից։ Երկնիշները համեմատում ենք <b>նախ տասնավորներով</b>, հետո միավորներով. ${f(asc)}։`,
    vars:{ nums }
  };
}, verify(v){ return `$${[...v.nums].sort((x,y)=>x-y).join(' \\lt ')}$`; }},

{ level:1, subtopic:"Զույգ և կենտ թվեր", bloom:"Հասկացում", badgeClass:"lvl-1", gen(){
  const askEven = Math.random() < 0.5;

  do {

      t1  = (2*rand(1,4))*10 + (2*rand(0,4)+1);          // զույգ տասնավոր, կենտ միավոր (օր. 47)
      t2  = rand(1,9)*10 + 5;                            // 5-ով ավարտվող
      t3  = (2*rand(0,4)+1)*10 + (2*rand(0,4)+1);        // երկու թվանշանն էլ կենտ
    } else {
      ans = (2*rand(1,4))*10 + (2*rand(0,4)+1);          // զույգ տասնավոր, կենտ միավոր (օր. 43)
      t1  = (2*rand(0,4)+1)*10 + 2*rand(0,4);            // կենտ տասնավոր, զույգ միավոր
      t2  = rand(1,9)*10;                                // 0-ով ավարտվող

          { v:t3, why:"շփոթում է «զույգ» և «կենտ» բառերը" } ],

    vars:{ nums:[ans,t1,t2,t3], askEven }

{ level:1, subtopic:"Կարգային գումարելիներ", bloom:"Կիրառում", badgeClass:"lvl-1", gen(){
  const three = Math.random() < 0.6;

  const n = three ? 100*h + 10*t + u : 10*t + u;

    { v:Number(parts.join('')), why:"կարգային գումարելիները կողք կողքի է գրում՝ գումարելու փոխարեն" },
    { v:three ? 100*h + u*10 + t : 10*u + t, why:"միավորներն ու տասնավորները տեղերով է փոխում" },
    { v:n*10, why:"ամեն գումարելին մեկ կարգ բարձր է համարում" } ];
  return {
    q:`Ո՞ր թիվն է. $${parts.join('+')}$`,
    ans:n,
    bad:cands,
    rationale:`Գումարում ենք կարգային գումարելիները. $${parts.join('+')}=${n}$։ ${three && t===0 ? "<b>Տասնավորների կարգում ոչինչ չկա, այնտեղ գրվում է 0։</b>" : ""}`,
    vars:{ parts }
  };
}, verify(v){ return v.parts.reduce((a,b)=>a+b,0); }},

{ level:1, subtopic:"Բանավոր գումարում և հանում (առանց անցման)", bloom:"Կիրառում", badgeClass:"lvl-1", gen(){
  const add = Math.random() < 0.5;
  let a, b;
  do {
    if (add) { a = rand(11,78); b = rand(11,88); } else { a = rand(25,99); b = rand(11,a-11); }
  } while (add ? ((a%10)+(b%10) > 9 || a+b > 99) : ((a%10) < (b%10)));
  const ans = add ? a+b : a-b;
  const ta = Math.floor(a/10), tb = Math.floor(b/10), ua = a%10, ub = b%10;
  return {
    q:`Հաշվիր. $${a}${add?"+":"-"}${b}$`,
    ans,
    bad:[ { v:AS_pos(add ? 10*(ta+tb) : 10*(ta-tb)), why:"հաշվում է միայն տասնավորները և մոռանում միավորները" },
          { v:AS_pos(add ? a + tb + ub : a - tb - ub), why:"երկրորդ թվի տասնավորները գործածում է որպես միավորներ" },
          { v:add ? ans + 10 : ans + 10, why:"տասնավորներում մեկով ավել է հաշվում" },
          { v:AS_pos(ans - 10),            why:"տասնավորներում մեկով պակաս է հաշվում" } ],
    rationale:`Տասնավորները՝ տասնավորներին, միավորները՝ միավորներին. $${10*ta}${add?"+":"-"}${10*tb}=${add?10*(ta+tb):10*(ta-tb)}$, $${ua}${add?"+":"-"}${ub}=${add?ua+ub:ua-ub}$։ Պատասխան՝ $${ans}$։`,
    vars:{ a, b, add }
  };
}, verify(v){ return v.add ? v.a + v.b : v.a - v.b; }},

/* ============================ LEVEL 2 ============================ */

{ level:2, subtopic:"Գումարում կարգային անցումով", bloom:"Կիրառում", badgeClass:"lvl-2", gen(){
  let a, b; do { a = rand(12,79); b = rand(3,59); } while ((a%10)+(b%10) <= 10 || a+b > 99);
  const ans = a + b, tens = Math.floor(a/10)+Math.floor(b/10), units = (a%10)+(b%10);
  return {

          { v:Number(`${tens}${units}`),      why:"տասնավորների և միավորների գումարները կողք կողքի է գրում (օր. 6|13)" },
          { v:ans + 10,                      why:"փոխանցում է 1 տասնավոր ավելի" },
          { v:AS_pos(ans - 1),               why:"10-ը լրացնելիս մեկ միավոր պակաս է ավելացնում" } ],
    rationale:`Միավորներ՝ $${a%10}+${b%10}=${units}$, այսինքն՝ <b>1 տասնավոր</b> և $${units-10}$ միավոր։ Տասնավորներ՝ $${tens}+1=${tens+1}$։ Պատասխան՝ $${ans}$։`,
    vars:{ a, b }

}, verify(v){ return v.b + v.a; }},

{ level:2, subtopic:"Հանում կարգային անցումով", bloom:"Կիրառում", badgeClass:"lvl-2", gen(){

{ level:2, subtopic:"Սյունակով գումարում և հանում (բազմանիշ)", bloom:"Կիրառում", badgeClass:"lvl-2", gen(){

          { v:add ? res - 10 : res + 10, why: add ? "մոռանում է փոխանցված 1-ը տասնավորներում" : "փոխառում է, բայց չի նվազեցնում հարևան կարգը" },

    rationale:`Գրում ենք <b>միավորները միավորների տակ, տասնավորները՝ տասնավորների</b>, և ${add?"գումարում":"հանում"} ենք աջից։ Պատասխան՝ $${res}$։ Ստուգում՝ ${add?`$${res}-${b}=${a}$`:`$${res}+${b}=${a}$`}։`,

{ level:2, subtopic:"Փակագծեր և գործողությունների կարգ", bloom:"Կիրառում", badgeClass:"lvl-2", gen(){
  let a, b, c, mode, ans, bad;
  do {
    mode = randEl(["minusSum","leftRight"]);
    a = 10*rand(4,9); b = 10*rand(1,4); c = 10*rand(1,4);
    if (mode === "minusSum") {
      ans = a - (b + c);
      bad = [ { v:AS_pos(a - b + c), why:"փակագծերն անտեսում է և հաշվում ձախից աջ" },
              { v:b + c,             why:"պատասխանում է փակագծի արժեքով" },
              { v:a - b,             why:"մոռանում է փակագծի երկրորդ գումարելին" },
              { v:AS_pos(a - c),     why:"հանում է միայն վերջին թիվը" } ];
    } else {
      ans = a - b + c;
      bad = [ { v:AS_pos(a - (b + c)), why:"նախ կատարում է գումարումը՝ կարծես այն փակագծում է" },
              { v:a - b,               why:"մոռանում է վերջին գործողությունը" },
              { v:AS_pos(a + b - c),   why:"գործողությունների նշանները տեղերով է փոխում" },
              { v:a + b + c,           why:"բոլոր թվերը գումարում է" } ];

  } while (ans <= 0 || b === c || !AS_ok3(bad.map(x=>x.v), ans));

    q:`Հաշվիր. $${mode === "minusSum" ? `${a}-(${b}+${c})` : `${a}-${b}+${c}`}$`,

                                    : `Առանց փակագծերի գումարումն ու հանումը կատարվում են <b>ձախից աջ</b>. $${a}-${b}=${a-b}$, $${a-b}+${c}=${ans}$։`,

{ level:2, subtopic:"Անհայտ գումարելի, նվազելի, հանելի", bloom:"Կիրառում", badgeClass:"lvl-2", gen(){

            { v:b, why:"պատասխանում է հայտնի գումարելիով" }, { v:ans + 10, why:"հանելիս տասնավորներում սխալվում է մեկով" } ];
    rat = `Անհայտ գումարելի $=$ գումար $-$ հայտնի գումարելի. $x=${S}-${b}=${ans}$։`; vars = { mode, p:S, b };
  } else if (mode === "minuend") {
    let D, b; do { D = rand(11,60); b = rand(11,39); } while (D === b || D + b > 99);
    ans = D + b; q = `x-${b}=${D}`;
    bad = [ { v:AS_pos(Math.abs(D - b)), why:"անհայտ նվազելին գտնելու համար հանում է" }, { v:D, why:"պատասխանում է տարբերությամբ" },
            { v:b, why:"պատասխանում է հանելիով" }, { v:ans - 10, why:"գումարելիս տասնավորներում սխալվում է մեկով" } ];
    rat = `Անհայտ նվազելի $=$ տարբերություն $+$ հանելի. $x=${D}+${b}=${ans}$։`; vars = { mode, p:D, b };
  } else {

            { v:a, why:"պատասխանում է նվազելիով" }, { v:ans + 10, why:"հանելիս տասնավորներում սխալվում է մեկով" } ];
    rat = `Անհայտ հանելի $=$ նվազելի $-$ տարբերություն. $x=${a}-${D}=${ans}$։`; vars = { mode, p:a, b:D };
  }
  return { q:`Լուծիր հավասարումը. $${q}$`, ans, bad, rationale:rat, vars };

{ level:3, subtopic:"Հարմար հաշվարկ (գումարման և հանման հատկություններ)", bloom:"Վերլուծություն", badgeClass:"lvl-4", gen(){

{ level:3, subtopic:"Երկքայլ տեքստային խնդիր", bloom:"Վերլուծություն", badgeClass:"lvl-4", gen(){

{ level:3, subtopic:"Կարգային գումարելի՝ հակադարձ", bloom:"Վերլուծություն", badgeClass:"lvl-4", gen(){

{ level:3, subtopic:"Թվանշաններից ամենամեծ/ամենափոքր թիվ", bloom:"Գնահատում", badgeClass:"lvl-4", gen(){

/* Աղբյուր՝ Բազա_1-9.xlsx, MATH-06-T01 (Տասնորդական կոտորակ), «Մաթեմատիկա 6»։
   fractions.js-ն արդեն ունի «Տասնորդականների համեմատում» (ամենամեծը 4-ից),
   «Տասնորդականների բաժանում» (ընդհանուր) և «Տասնորդականը որպես կրճատված
   կոտորակ» — այս թեման դրանք ՉԻ կրկնում։

   ՆԵՐԿԱՅԱՑՈՒՄ. CONFIG.math.maxDecimals = 1, իսկ այստեղ պետք են 2–4 նիշ։
   Ուստի բոլոր պատասխանները LaTeX տեքստ են՝ կառուցված ԱՄԲՈՂՋ թվերից
   (արժեք = n / 10^k), առանց float-ի։ verify()-ը օգտագործում է ԱՅԼ ճանապարհ
   (float + toFixed կամ տողային մանիպուլյացիա)՝ անկախ ածանցման համար։ */

// n/10^k → "$12{,}34$" (աջի զրոները ջնջված)
const DC_s = (n, k) => {
  const s = String(n).padStart(k + 1, '0');
  const ip = s.slice(0, s.length - k), fp = (k ? s.slice(s.length - k) : '').replace(/0+$/, '');
  return fp ? `${ip}{,}${fp}` : ip;
};
const DC = (n, k) => `$${DC_s(n, k)}$`;
// n/10^k → "$12{,}340$" (աջի զրոները ՊԱՀՊԱՆՎԱԾ — կլորացման և «աջի զրոներ» ենթաթեմաների համար)
const DC_raw = (n, k) => {
  const s = String(n).padStart(k + 1, '0');
  return k ? `$${s.slice(0, s.length - k)}{,}${s.slice(s.length - k)}$` : `$${s}$`;
};
// verify()-ի անկախ ուղի՝ float → toFixed → նույն ձևաչափ (աջի զրոները ջնջված)
const DC_f = (x, k) => {
  let s = x.toFixed(k);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return `$${s.replace('.', '{,}')}$`;
};
const DC_pow = (k) => Math.pow(10, k);

{ level:1, subtopic:"Տասնորդական կոտորակի կլորացում", bloom:"Կիրառում", badgeClass:"lvl-1", gen(){
  const k = 3, t = rand(0,2);                      // կլորացնում ենք մինչև t նիշ ստորակետից հետո
  const names = ["միավորների","տասնորդականների","հարյուրերորդականների"];

      { v: DC(alt(t+1), t+1),  why:"կլորացնում է մեկ կարգ ավելի ճշգրիտ, քան պահանջվում է" },
      { v: t>0 ? DC_raw(alt(t-1), t-1) : DC_raw(Math.round(n/10000)*10, 0), why: t>0 ? "կլորացնում է մեկ կարգ ավելի կոպիտ" : "կլորացնում է մինչև տասնավորները" },
      { v: DC(n, k),           why:"թիվը թողնում է անփոփոխ՝ «կլորացված» համարելով" }
    ],
    rationale:`Նայում ենք ${names[t]} կարգից աջ առաջին թվանշանին։ ${up ? "Այն 5–9 միջակայքում է, ուստի կարգի թվանշանը <b>մեծացնում ենք 1-ով</b>" : "Այն 5-ից փոքր է, ուստի կարգի թվանշանը <b>չի փոխվում</b>"}, իսկ աջի թվանշանները հեռացվում են. $${DC_s(n,k)}\\approx ${DC_raw(R,t).slice(1,-1)}$։`,

  // տողային ուղի. թվանշաններով, առանց բաժանման
  const s = String(v.n).padStart(4,'0');                 // 3 կոտորակային նիշ
  const digits = s.split('').map(Number);
  const cut = digits.length - 3 + v.t;                    // պահվող նիշերի քանակը
  let keep = digits.slice(0, cut);
  if (digits[cut] >= 5) {
    let i = keep.length - 1;
    while (i >= 0 && keep[i] === 9) { keep[i] = 0; i--; }
    if (i < 0) keep.unshift(1); else keep[i]++;
  }
  const str = keep.join('');
  const ip = str.slice(0, str.length - v.t) || '0', fp = str.slice(str.length - v.t);

}},

{ level:1, subtopic:"Տասնորդականների դասավորում", bloom:"Կիրառում", badgeClass:"lvl-1", gen(){

  const nums = [ {v:a*10, s:DC_s(a,1), i:a}, {v:b1, s:DC_s(b1,2), i:b1}, {v:c, s:DC_s(c,2), i:c}, {v:b2, s:DC_s(b2,2), i:b2} ];

  const asc   = [...nums].sort((x,y)=>x.v-y.v);

  const noZ   = [...nums].sort((x,y)=>(x===nums[2]?c*10:x.v)-(y===nums[2]?c*10:y.v)); // 0,0c-ն կարդում է 0,c

    q:`Դասավորիր աճման կարգով. $${shuffle(nums.map(x=>x.s)).join(';\\ ')}$`,

    bad:[
      { v:f(byInt),               why:"ստորակետից հետո մասերը համեմատում է որպես ամբողջ թվեր (կարծում է, որ ավելի շատ թվանշանը ավելի մեծ է)" },

      { v:f([...byInt].reverse()),why:"համեմատում է որպես ամբողջ թվեր և դասավորում նվազման կարգով" }

{ level:2, subtopic:"Ստորակետի տեղաշարժ (10, 100, 1000)", bloom:"Կիրառում", badgeClass:"lvl-2", gen(){

{ level:3, subtopic:"Գնումների խնդիր (մանր)", bloom:"Համադրում", badgeClass:"lvl-4", gen(){

{ level:3, subtopic:"Բոլոր բաժանարարների գումարը", bloom:"Գնահատում", badgeClass:"lvl-4", gen(){

{ level:1, subtopic:"Կոտորակների համեմատում", bloom:"Հասկացում", badgeClass:"lvl-1", gen(){
  let fracs, decs;
  do {
    const denoms = shuffle([2,3,4,5,6,8,9,10,12]).slice(0,4);
    fracs = denoms.map(d => { let a=rand(1,d-1); while(gcd(a,d)!==1) a=rand(1,d-1); return [a,d]; });
    decs = fracs.map(([a,d]) => a/d);
  } while (new Set(decs.map(d => d.toFixed(6))).size < 4);
  const maxIdx = decs.indexOf(Math.max(...decs));
  const ans = `$\\frac{${fracs[maxIdx][0]}}{${fracs[maxIdx][1]}}$`;
  const q = `Ո՞ր կոտորակն է ամենամեծը. ${fracs.map(([a,d]) => `$\\frac{${a}}{${d}}$`).join('; ')}`;
  const bad = fracs.map(([a,d],i) => i===maxIdx ? null : {
    v:`$\\frac{${a}}{${d}}$`,
    why: a===Math.max(...fracs.map(f=>f[0])) ? "ընտրում է ամենամեծ համարիչով կոտորակը՝ հայտարարներին ուշադրություն չդարձնելով" : "ընտրում է ամենափոքր հայտարարով կոտորակը՝ կարծելով, թե դա ամենամեծն է"
  }).filter(Boolean);
  return { q, ans,
    bad,
    rationale:`Բերենք բոլորը տասնորդական տեսքի. ${fracs.map(([a,d]) => `$\\frac{${a}}{${d}}\\approx${fix(Math.round(a/d*1000)/1000)}$`).join(', ')}: Ամենամեծն է ${ans}:`,
    vars:{fracs} }; },
  verify(v){
    let best=0, bestVal=-Infinity;
    v.fracs.forEach(([a,d],i) => { const val=a/d; if (val>bestVal){ bestVal=val; best=i; } });
    const [a,d]=v.fracs[best]; return `$\\frac{${a}}{${d}}$`;
  } },

/* Աղբյուր՝ Բազա 1-4 v12, 4-րդ դաս. Գլ. II (4.2.1–4.2.7)։ Bad-երը՝ բազայի
   «Սխալ պատասխան»-ներից. «3/5-ում համարիչը 5-ն է», «հինգ ութերորդ → 8/5»,
   «60-ի 2/3 → 20», «թիվը, որի 2/3-ը 12 է → 8», «1/4 < 1/8», «2/7+3/7 → 5/14»,
   «5/9−2/9 → 3/0», «1 − 2/5 → 2/5» և այլն։
   Բոլոր կոտորակները ցուցադրվում են frac()-ով (կրճատված, կանոն «Կրճատված կոտորակներ»)։ */

const FI_pos = (v) => (Number.isInteger(v) && v > 0 ? v : null);
const FI_ok3 = (xs, ans) => { const ok = xs.filter(x => x !== null && x !== undefined && x !== ans); return new Set(ok.map(String)).size >= 3; };
const FI_f = (n, d) => `$${frac(n, d)}$`;
const FI_num = ["","մեկ","երկու","երեք","չորս","հինգ","վեց","յոթ","ութ","ինը","տասը","տասնմեկ","տասներկու"];
const FI_den = ["","","երկրորդ","երրորդ","չորրորդ","հինգերորդ","վեցերորդ","յոթերորդ","ութերորդ","իններորդ","տասներորդ","տասնմեկերորդ","տասներկուերորդ"];

TOPIC({

tasks: [

{ level:1, subtopic:"Համարիչ և հայտարար", bloom:"Իմացություն", badgeClass:"lvl-1", gen(){

    bad:[ { v: askNum ? b : a, why:"շփոթում է համարիչի (վերևի) և հայտարարի (ներքևի) դիրքերը" },
          { v: a + b,          why:"գումարում է համարիչն ու հայտարարը" },

    vars:{ a, b, askNum }

{ level:1, subtopic:"Կոտորակի գրառում բառերից", bloom:"Իմացություն", badgeClass:"lvl-1", gen(){

    q:`Ինչպե՞ս է կարդացվում $${frac(a,b)}$ կոտորակը:`,
    ans:`${FI_num[a]} ${FI_den[b]}`,
    bad:[ { v:`${FI_num[b]} ${FI_den[a]}`,  why:"համարիչն ու հայտարարը տեղերով է կարդում" },
          { v:`${FI_num[a]} ${FI_num[b]}`,  why:"հայտարարը կարդում է քանակական թվականով («"+FI_num[b]+"»), ոչ թե դասականով («"+FI_den[b]+"»)" },

  return {

    bad:[ { v:`$\\frac{${b}}{${a}}$`,       why:"համարիչն ու հայտարարը տեղերով է փոխում" },
          { v:FI_f(1, b),                   why:"գրում է միայն մասի անվանումը՝ մոռանալով վերցված մասերի քանակը" },
          { v:FI_f(1, a),                   why:"«"+FI_num[a]+"»-ը համարում է մասերի քանակ" },
          { v:gcd(a, b+1) === 1 ? FI_f(a, b+1) : null, why:"հայտարարը մեկով ավել է հաշվում" } ],

    vars:{ a, b, mode:"write" }
  };
}, verify(v){ return v.mode === "read" ? `${FI_num[v.a]} ${FI_den[v.b]}` : `$${frac(v.a, v.b)}$`; }},

{ level:1, subtopic:"Մաս և ամբողջ", bloom:"Հասկացում", badgeClass:"lvl-1", gen(){
  let n, k; do { n = rand(3,12); k = rand(1, n-1); } while (gcd(k, n) !== 1 || 2*k === n);
  const ctx = randEl([`Պիցցան կտրեցին $${n}$ հավասար կտորի, և կերան $${k}$ կտորը։ Պիցցայի ո՞ր մասն են կերել:`,
                      `Շոկոլադը բաժանված է $${n}$ հավասար կտորի։ Աննան կերավ $${k}$ կտոր։ Շոկոլադի ո՞ր մասը կերավ Աննան:`]);
  return {

          { v:FI_f(n - k, n),           why:"պատասխանում է մնացած մասով" },
          { v:FI_f(k, n - k),           why:"կերածը համեմատում է մնացածի, ոչ թե ամբողջի հետ" },
          { v:FI_f(1, n),               why:"պատասխանում է մեկ կտորի մասով" } ],

{ level:1, subtopic:"Կանոնավոր և անկանոն կոտորակներ", bloom:"Հասկացում", badgeClass:"lvl-1", gen(){
  let P, pr1, pr2, pr3;

{ level:1, subtopic:"Կոտորակների համեմատում", bloom:"Կիրառում", badgeClass:"lvl-1", gen(){

{ level:3, subtopic:"Ո՞ր մասն է մնացել", bloom:"Վերլուծություն", badgeClass:"lvl-4", gen(){

{ level:3, subtopic:"Մասեր մեծությունների միավորներով", bloom:"Համադրում", badgeClass:"lvl-4", gen(){
  const U = randEl([ { w:"ժամ", s:"րոպե", T:60, dens:[2,3,4,5,6,10,12] }, { w:"մ", s:"սմ", T:100, dens:[2,4,5,10,20,25] },
                     { w:"կգ", s:"գ", T:1000, dens:[2,4,5,8,10,20,25] }, { w:"օր", s:"ժամ", T:24, dens:[2,3,4,6,8,12] } ]);
  let b, a; do { b = randEl(U.dens); a = rand(1, b-1); } while (gcd(a,b) !== 1);
  const ans = U.T / b * a;
  if (!FI_ok3([U.T/b, U.T*a, FI_pos(U.T % a === 0 ? U.T/a*b : null), U.T - ans, Number(`${a}${b}`)], ans) || a === 1 && U.T/b === ans) return this.gen();
  return {
    q:`Քանի՞ ${U.s} է $1$ ${U.w}-ի $${frac(a,b)}$ մասը:`,
    ans,
    bad:[ { v:U.T / b,     why:"գտնում է միայն մեկ մասը" },
          { v:U.T * a,     why:"մոռանում է բաժանել հայտարարի վրա" },
          { v:FI_pos(U.T % a === 0 ? U.T / a * b : null), why:"համարիչն ու հայտարարը շփոթում է" },
          { v:U.T - ans,   why:"պատասխանում է մնացած մասով" },
          { v:a * 10 + b === ans ? null : Number(`${a}${b}`), why:"կոտորակի թվերը գրում է կողք կողքի" } ],
    rationale:`$1$ ${U.w} $=${U.T}$ ${U.s}։ $${U.T}:${b}=${U.T/b}$, $${U.T/b}\\cdot${a}=${ans}$ ${U.s}։`,
    vars:{ T:U.T, a, b }
  };
}, verify(v){ return v.T * v.a / v.b; }},

{ level:3, subtopic:"Տարբեր ամբողջների մասերի համեմատում", bloom:"Գնահատում", badgeClass:"lvl-4", gen(){
  let A, B, p, q; do { p = randEl([2,3,4,5]); q = randEl([2,3,4,5]); A = p * rand(20,90); B = q * rand(20,90); } while (A/p === B/q || A === B);
  const x = A/p, y = B/q, ans = Math.abs(x - y), more = x > y ? "Արամը" : "Սոնան";
  return {
    q:`Արամն ունի $${A}$ դրամի $${frac(1,p)}$ մասը, իսկ Սոնան՝ $${B}$ դրամի $${frac(1,q)}$ մասը։ Քանի՞ դրամով է ավելի շատ ունի ${more}:`,
    ans,
    bad:[ { v:FI_pos(Math.abs(A - B)), why:"համեմատում է ամբողջները՝ ոչ թե մասերը" },
          { v:x + y,                   why:"գումարում է մասերը՝ հանելու փոխարեն" },
          { v:Math.max(x, y),          why:"գտնում է ավելի մեծ մասը, բայց չի հանում փոքրը" },
          { v:FI_pos(p === q ? null : Math.abs(A/q - B/p)), why:"կոտորակները խառնում է (Արամի գումարը բաժանում է Սոնայի հայտարարի վրա)" } ],
    rationale:`Արամ՝ $${A}:${p}=${x}$ դրամ, Սոնա՝ $${B}:${q}=${y}$ դրամ։ Տարբերությունը՝ $${Math.max(x,y)}-${Math.min(x,y)}=${ans}$։ <b>Նույն կոտորակը տարբեր ամբողջներից տարբեր մեծություն է։</b>`,
    vars:{ A, B, p, q }
  };
}, verify(v){ return Math.abs(v.A * v.q - v.B * v.p) / (v.p * v.q); }}

]});

{ level:3, subtopic:"Որոշման տիրույթ (արմատ)", bloom:"Գնահատում", badgeClass:"lvl-4", gen(){

{ level:3, subtopic:"Պարաբոլի և ուղղի հատման կետեր", bloom:"Համադրում", badgeClass:"lvl-4", gen(){
  const setEq=(p,q)=>{ const sp=[...p].sort((a,b)=>a-b), sq=[...q].sort((a,b)=>a-b); return sp[0]===sq[0]&&sp[1]===sq[1]; };
  let x1,x2,m,n,b,c;
  do {
    x1=randNZ(-6,6); x2=randNZ(-6,6); while(x2===x1||x2===-x1) x2=randNZ(-6,6);
    if (x1>x2) [x1,x2]=[x2,x1];
    m=randNZ(-5,5); n=randNZ(-9,9);
    b=m-(x1+x2); c=n+x1*x2;
  } while (setEq([b,c],[x1,x2]) || setEq([b,c],[-x1,-x2]) || setEq([b,c],[x1,-x2]));
  return { q:`Գտիր $y=x^2${sgnCx(b)}${sgnT(c)}$ պարաբոլի և $y=${cx(m)}${sgnT(n)}$ ուղղի հատման կետերի աբսցիսները:`, ans:`$x_1=${x1},\\;x_2=${x2}$`,
    bad:[{v:`$x_1=${-x1},\\;x_2=${-x2}$`,why:"արմատների նշանները շրջում է"},
         {v:`$x_1=${x1},\\;x_2=${-x2}$`,why:"մեկ արմատի նշանն է սխալ վերցնում"},
         {v:`$x_1=${b},\\;x_2=${c}$`,why:"արմատների փոխարեն գրում է հավասարման գործակիցները"}],
    rationale:`Հավասարեցնում ենք. $x^2${sgnCx(b)}${sgnT(c)}=${cx(m)}${sgnT(n)}\\Rightarrow x^2${sgnCx(b-m)}${sgnT(c-n)}=0$: Արմատներն են $${x1}$ և $${x2}$:`,
    vars:{b,c,m,n} }; },
  verify(v){
    const B=v.b-v.m, C=v.c-v.n, D=B*B-4*C, sq=Math.sqrt(D);
    const r1=(-B-sq)/2, r2=(-B+sq)/2, lo=Math.min(r1,r2), hi=Math.max(r1,r2);
    return `$x_1=${lo},\\;x_2=${hi}$`;
  } },

/* Աղբյուր՝ Բազա 1-4 v12. 3-րդ դաս. 3.1.7 (կլորացում), 3.2.4–3.2.16,
   4-րդ դաս. 4.1.3–4.1.12։ Bad-երը՝ բազայի կոնկրետ սխալներից.
   «146·3 → 328 կամ 31218», «205·4 → 800», «609:3 → 23», «500:5 → 10»,
   «x·4=120 → 480», «612:3 → 24», «372+248=620» (առանց տեղաշարժի),
   «200 − 80:4 + 30» (ձախից աջ) և այլն։
   Նշում. v12-ի 3.2.7-ում «906:3=303» պատասխանը սխալ է (ճիշտը՝ 302)։ */

const MD_pos = (v) => (Number.isInteger(v) && v > 0 ? v : null);
const MD_ok3 = (xs, ans) => { const ok = xs.filter(x => x !== null && x !== undefined && x !== ans); return new Set(ok.map(String)).size >= 3; };
// սյունակով բազմապատկում միանիշով՝ տարբեր սխալ ալգորիթմներով (աջից ձախ)
const MD_mul1 = (a, m, mode) => {
  const d = String(a).split('').reverse().map(Number);
  if (mode === "concat") return Number(d.map(x => x*m).reverse().join(''));        // 146·3 → 3|12|18
  let carry = 0, out = [];
  d.forEach(x => {
    if (mode === "noCarry") { out.push((x*m) % 10); return; }                       // փոխանցումը մոռանում է
    const v = mode === "carryFirst" ? (x + carry) * m : x*m + carry;                // փոխանցածը գումարում է նախքան բազմապատկելը
    out.push(v % 10); carry = Math.floor(v / 10);
  });
  if (mode !== "noCarry" && carry) out.push(...String(carry).split('').reverse().map(Number));
  return Number(out.reverse().join(''));
};
